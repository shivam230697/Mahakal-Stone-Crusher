{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="d-flex justify-content-between mb-3"><h3>{{ page_title }}</h3><a href="javascript:history.back()" class="btn btn-outline-secondary">Back</a></div><div class="card border-0 shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}</div><button class="btn btn-primary mt-4">Save</button></form></div></div></div></div>
<script>document.querySelectorAll('input,select,textarea').forEach(e=>{if(!e.classList.contains('form-check-input'))e.classList.add('form-control')});document.querySelectorAll('select').forEach(e=>e.classList.add('form-select'));</script>{% endblock %}
