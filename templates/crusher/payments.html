{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h3>{{ page_title }}</h3><a class="btn btn-primary" href="{% url 'payment_add' %}">Add payment</a></div><div class="card border-0 shadow-sm table-responsive"><table class="table table-striped mb-0"><thead><tr><th>Date</th><th>Party</th><th>Type</th><th>Amount</th><th>Mode</th><th>Reference</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.date }}</td><td>{{ r.party }}</td><td>{{ r.get_payment_type_display }}</td><td>₹{{ r.amount }}</td><td>{{ r.mode }}</td><td>{{ r.reference }}</td></tr>{% empty %}<tr><td colspan="6" class="text-center p-4">No payments</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
