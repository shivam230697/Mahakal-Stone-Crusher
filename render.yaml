databases:
  - name: mahakal-stone-db
    plan: free
    databaseName: mahakal_stone
    user: mahakal_user
services:
  - type: web
    name: mahakal-stone-crusher
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mahakal_erp.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mahakal-stone-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8"
