services:
  - type: web
    name: mahakal-stone-crusher
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn mahakal_erp.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8"
