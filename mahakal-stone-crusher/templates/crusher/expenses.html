{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h3>{{ page_title }}</h3><a class="btn btn-primary" href="{% url 'expense_add' %}">Add expense</a></div><div class="card border-0 shadow-sm table-responsive"><table class="table table-striped mb-0"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid to</th><th>Mode</th><th>Amount</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.date }}</td><td>{{ r.category }}</td><td>{{ r.description }}</td><td>{{ r.paid_to }}</td><td>{{ r.payment_mode }}</td><td>₹{{ r.amount }}</td></tr>{% empty %}<tr><td colspan="6" class="text-center p-4">No expenses</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
