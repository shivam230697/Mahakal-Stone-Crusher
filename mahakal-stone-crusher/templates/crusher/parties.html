{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h3>{{ page_title }}</h3><a class="btn btn-primary" href="{% url 'party_add' %}">Add party</a></div><div class="card border-0 shadow-sm table-responsive"><table class="table table-striped mb-0"><thead><tr><th>Name</th><th>Type</th><th>Phone</th><th>GSTIN</th><th>Opening balance</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.get_party_type_display }}</td><td>{{ r.phone }}</td><td>{{ r.gstin }}</td><td>{{ r.opening_balance }} {{ r.opening_balance_type }}</td></tr>{% empty %}<tr><td colspan="5" class="text-center p-4">No parties</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
